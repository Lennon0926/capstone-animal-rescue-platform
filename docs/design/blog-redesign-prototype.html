<!doctype html>
<html lang="es-PR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blog · Ciudadanos Pro Albergue de Animales de Aguadilla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Brand tokens — pulled from globals.css of the host project.
     No Facebook blue. Warm editorial palette.
     ============================================================ */
  :root {
    --color-primary: #1f3c4f;
    --color-primary-hover: #162c3b;
    --color-primary-soft: #e6f0f5;
    --color-accent: #e76f51;
    --color-accent-hover: #cf5c40;
    --color-secondary: #2a9d8f;

    --color-surface: #fdfbf3;
    --color-bg: #ffffff;
    --color-bg-footer: #f5f6f8;
    --color-border: #e9e2da;
    --color-border-strong: #d6cdc1;

    --color-text: #2a2a2a;
    --color-text-muted: #6f6f6f;
    --color-text-soft: #8b8378;
    --color-text-inverse: #ffffff;

    --serif: "Source Serif 4", Georgia, serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;

    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 16px;

    --shadow-sm: 0 1px 2px rgba(31, 60, 79, 0.04);
    --shadow-md: 0 6px 24px -8px rgba(31, 60, 79, 0.12);

    --col-width: 720px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; padding: 0; }

  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    color: var(--color-text);
    background: var(--color-surface);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea { font-family: inherit; font-size: inherit; color: inherit; }

  /* ============================================================
     Site header (matches host project's header pattern)
     ============================================================ */
  .site-header {
    position: sticky;
    top: 0;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    z-index: 100;
  }
  .site-header__inner {
    max-width: 1200px;
    margin: 0 auto;
    height: 72px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .site-header__brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .site-header__logo {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--color-primary-soft);
    flex-shrink: 0;
    display: grid;
    place-items: center;
  }
  .site-header__logo img { width: 100%; height: 100%; object-fit: cover; }
  .site-header__org {
    font-weight: 600;
    font-size: 14px;
    color: var(--color-text);
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 360px;
  }
  .site-header__nav {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .site-header__nav a {
    font-size: 14px;
    color: var(--color-text-muted);
    transition: color 0.15s ease;
  }
  .site-header__nav a:hover { color: var(--color-text); }
  .site-header__nav a.active { color: var(--color-text); font-weight: 500; }
  .site-header__donate {
    padding: 8px 16px;
    border-radius: 8px;
    background: var(--color-primary);
    color: var(--color-text-inverse) !important;
    font-weight: 500;
    font-size: 14px;
  }
  .site-header__donate:hover { background: var(--color-primary-hover); }

  @media (max-width: 768px) {
    .site-header__nav a:not(.site-header__donate) { display: none; }
    .site-header__org { max-width: 180px; font-size: 13px; }
  }

  /* ============================================================
     Editorial masthead
     ============================================================ */
  .masthead {
    border-bottom: 1px solid var(--color-border);
    background: var(--color-surface);
  }
  .masthead__inner {
    max-width: var(--col-width);
    margin: 0 auto;
    padding: 72px 24px 56px;
  }
  .masthead__eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-accent);
    margin-bottom: 24px;
  }
  .masthead__eyebrow::before,
  .masthead__eyebrow::after {
    content: "";
    width: 24px;
    height: 1px;
    background: var(--color-accent);
    opacity: 0.5;
  }
  .masthead__title {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(44px, 7vw, 76px);
    line-height: 0.98;
    letter-spacing: -0.02em;
    color: var(--color-primary);
    margin-bottom: 24px;
  }
  .masthead__title em {
    font-style: italic;
    color: var(--color-accent);
    font-weight: 400;
  }
  .masthead__lede {
    font-family: var(--serif);
    font-size: 20px;
    line-height: 1.55;
    color: var(--color-text);
    max-width: 560px;
    text-wrap: pretty;
  }
  .masthead__meta {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-top: 36px;
    padding-top: 24px;
    border-top: 1px solid var(--color-border);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--color-text-soft);
  }
  .masthead__meta strong {
    color: var(--color-text);
    font-weight: 500;
  }
  .masthead__meta-dot {
    width: 3px;
    height: 3px;
    background: var(--color-text-soft);
    border-radius: 50%;
  }

  /* ============================================================
     Featured story
     ============================================================ */
  .feed {
    max-width: var(--col-width);
    margin: 0 auto;
    padding: 56px 24px 96px;
  }

  .featured {
    margin-bottom: 72px;
    padding-bottom: 64px;
    border-bottom: 1px solid var(--color-border);
  }
  .featured__label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--color-accent);
    margin-bottom: 20px;
  }
  .featured__dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--color-accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.4); }
  }
  .featured__grid {
    display: grid;
    grid-template-columns: 5fr 7fr;
    gap: 32px;
    align-items: start;
  }
  @media (max-width: 640px) {
    .featured__grid { grid-template-columns: 1fr; gap: 24px; }
  }
  .featured__media {
    border-radius: var(--radius-md);
    overflow: hidden;
  }
  .featured__date {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--color-text-soft);
    margin-bottom: 12px;
  }
  .featured__title {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(28px, 3.5vw, 36px);
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: var(--color-primary);
    margin-bottom: 16px;
  }
  .featured__excerpt {
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.55;
    color: var(--color-text);
    margin-bottom: 20px;
    text-wrap: pretty;
  }
  .featured__meta {
    display: flex;
    gap: 16px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--color-text-muted);
    margin-bottom: 24px;
  }
  .featured__link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    font-size: 14px;
    color: var(--color-accent);
    border-bottom: 1px solid currentColor;
    padding-bottom: 2px;
    transition: gap 0.2s ease, color 0.15s ease;
  }
  .featured__link:hover { gap: 10px; color: var(--color-accent-hover); }

  /* ============================================================
     Composer (author mode)
     ============================================================ */
  .composer {
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-md);
    background: #fff;
    margin-bottom: 56px;
    transition: box-shadow 0.2s ease;
  }
  .composer--collapsed {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    width: 100%;
    text-align: left;
    cursor: pointer;
  }
  .composer--collapsed:hover { box-shadow: var(--shadow-md); border-color: var(--color-primary); }
  .composer__avatar {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--color-primary);
    color: #fff;
    display: grid;
    place-items: center;
    font-weight: 600;
    font-size: 15px;
  }
  .composer__prompt {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .composer__prompt > span:first-child {
    font-size: 14px;
    color: var(--color-text);
  }
  .composer__hint {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--color-text-soft);
  }
  .composer__cta {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--color-accent);
    font-weight: 600;
  }
  .composer--open { padding: 20px; }
  .composer__head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .composer__name { font-size: 14px; font-weight: 600; color: var(--color-text); }
  .composer__close {
    margin-left: auto;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 22px;
    color: var(--color-text-muted);
    line-height: 1;
  }
  .composer__close:hover { background: var(--color-border); color: var(--color-text); }
  .composer__title {
    width: 100%;
    border: none;
    outline: none;
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 500;
    color: var(--color-primary);
    padding: 8px 0;
    border-bottom: 1px solid var(--color-border);
    margin-bottom: 12px;
  }
  .composer__title::placeholder { color: var(--color-text-soft); }
  .composer__body {
    width: 100%;
    border: none;
    outline: none;
    resize: vertical;
    font-size: 15px;
    line-height: 1.6;
    color: var(--color-text);
    padding: 8px 0;
    min-height: 120px;
  }
  .composer__body::placeholder { color: var(--color-text-soft); }
  .composer__tools {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--color-border);
    flex-wrap: wrap;
  }
  .composer__attach { display: flex; gap: 4px; }
  .composer__attach-btn {
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    color: var(--color-text-muted);
    transition: background 0.15s ease;
  }
  .composer__attach-btn:hover:not(:disabled) { background: var(--color-border); color: var(--color-text); }
  .composer__attach-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .composer__submit { display: flex; gap: 8px; }
  .btn-primary {
    padding: 8px 18px;
    border-radius: 6px;
    background: var(--color-primary);
    color: #fff;
    font-weight: 500;
    font-size: 14px;
    transition: background 0.15s ease;
  }
  .btn-primary:hover:not(:disabled) { background: var(--color-primary-hover); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-ghost {
    padding: 8px 16px;
    border-radius: 6px;
    color: var(--color-text-muted);
    font-weight: 500;
    font-size: 14px;
  }
  .btn-ghost:hover { background: var(--color-border); color: var(--color-text); }

  /* ============================================================
     Posts (single editorial column, always-expanded)
     ============================================================ */
  .feed__list { display: flex; flex-direction: column; }
  .feed__item { padding: 48px 0; border-top: 1px solid var(--color-border); }
  .feed__item:first-child { padding-top: 0; border-top: none; }
  .feed__item.feed__item--local { position: relative; }
  .feed__item--local::before {
    content: "Recién publicado";
    position: absolute;
    top: 36px;
    right: 0;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-secondary);
    background: rgba(42, 157, 143, 0.08);
    padding: 4px 8px;
    border-radius: 4px;
  }

  .post__header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .post__date {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--color-text-soft);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 4px;
  }
  .badge--reel { background: rgba(231, 111, 81, 0.1); color: var(--color-accent); }
  .badge--shared { background: var(--color-primary-soft); color: var(--color-primary); }

  .post__title {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 28px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    color: var(--color-primary);
    margin-bottom: 16px;
    text-wrap: balance;
  }
  .post__body { margin-bottom: 24px; }
  .post__para {
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.65;
    color: var(--color-text);
    text-wrap: pretty;
  }
  .post__para + .post__para { margin-top: 16px; }

  .post--dense .post__title { font-size: 22px; }
  .post--dense .post__para { font-size: 15px; line-height: 1.6; font-family: var(--sans); }
  .post--dense.feed__item { padding: 32px 0; }

  /* Image grids */
  .post-image, .post-image-grid {
    margin: 24px 0;
    border-radius: var(--radius-md);
    overflow: hidden;
  }
  .post-image-grid { display: grid; gap: 4px; }
  .post-image-grid--2 { grid-template-columns: 1fr 1fr; }
  .post-image-grid--3 {
    grid-template-columns: 2fr 1fr;
    grid-auto-rows: minmax(0, 1fr);
  }
  .post-image-grid__col { display: grid; gap: 4px; grid-template-rows: 1fr 1fr; }
  .post-image-grid--4 { grid-template-columns: 1fr 1fr; }
  .post-image-grid__tile { position: relative; }
  .post-image-grid__more {
    position: absolute;
    inset: 0;
    background: rgba(31, 60, 79, 0.55);
    color: #fff;
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 500;
    display: grid;
    place-items: center;
  }

  /* Striped placeholder (no AI-slop SVGs) */
  .img-placeholder {
    width: 100%;
    background-image: repeating-linear-gradient(
      135deg,
      #f0e9dc 0,
      #f0e9dc 12px,
      #e9e2d2 12px,
      #e9e2d2 24px
    );
    display: grid;
    place-items: center;
    color: var(--color-primary);
  }
  .img-placeholder__label {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    background: rgba(253, 251, 243, 0.92);
    padding: 6px 12px;
    border-radius: 4px;
    color: var(--color-primary);
    text-align: center;
    max-width: 80%;
  }

  /* Footer / actions */
  .post__footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--color-border);
    flex-wrap: wrap;
    gap: 12px;
  }
  .post__actions { display: flex; gap: 4px; }
  .action {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 13px;
    color: var(--color-text-muted);
    transition: background 0.15s ease, color 0.15s ease;
  }
  .action:hover:not(.action--static) { background: var(--color-border); color: var(--color-text); }
  .action--active { color: var(--color-accent); }
  .action--static { cursor: default; }
  .action__icon { font-size: 14px; line-height: 1; }
  .post__source {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--color-text-soft);
    transition: color 0.15s ease;
  }
  .post__source:hover { color: var(--color-primary); }

  /* Comments */
  .comments {
    margin-top: 20px;
    padding: 20px;
    background: rgba(233, 226, 218, 0.35);
    border-radius: var(--radius-md);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .comment { display: flex; gap: 12px; }
  .comment__avatar {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--color-primary-soft);
    color: var(--color-primary);
    display: grid;
    place-items: center;
    font-weight: 600;
    font-size: 13px;
  }
  .comment__body { flex: 1; min-width: 0; }
  .comment__head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 2px;
  }
  .comment__name { font-size: 13px; font-weight: 600; color: var(--color-text); }
  .comment__date {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--color-text-soft);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .comment__text { font-size: 14px; color: var(--color-text); line-height: 1.5; }

  /* ============================================================
     Site footer (matches host project)
     ============================================================ */
  .site-footer {
    background: var(--color-bg-footer);
    padding: 64px 24px 32px;
    border-top: 1px solid var(--color-border);
  }
  .site-footer__inner {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 48px;
  }
  @media (max-width: 640px) {
    .site-footer__inner { grid-template-columns: 1fr; gap: 32px; }
  }
  .site-footer__brand { font-family: var(--serif); font-size: 18px; font-weight: 500; color: var(--color-primary); margin-bottom: 8px; }
  .site-footer__tagline { font-size: 14px; color: var(--color-text-muted); max-width: 320px; line-height: 1.5; }
  .site-footer__heading { font-size: 13px; font-weight: 600; color: var(--color-text); margin-bottom: 12px; }
  .site-footer__list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .site-footer__list a { font-size: 14px; color: var(--color-text-muted); }
  .site-footer__list a:hover { color: var(--color-primary); }
  .site-footer__bottom {
    max-width: 1200px;
    margin: 48px auto 0;
    padding-top: 24px;
    border-top: 1px solid var(--color-border);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--color-text-soft);
    text-align: center;
  }

  /* ============================================================
     Loading shimmer
     ============================================================ */
  .skeleton {
    padding: 48px 0;
    border-top: 1px solid var(--color-border);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .skeleton:first-child { border-top: none; padding-top: 0; }
  .skel-line {
    height: 14px;
    background: linear-gradient(90deg, #ece4d4 25%, #f6f0e3 50%, #ece4d4 75%);
    background-size: 200% 100%;
    animation: shimmer 1.6s infinite;
    border-radius: 4px;
  }
  .skel-line--short { width: 60%; }
  .skel-line--title { height: 28px; width: 80%; }
  .skel-img {
    height: 280px;
    background: linear-gradient(90deg, #ece4d4 25%, #f6f0e3 50%, #ece4d4 75%);
    background-size: 200% 100%;
    animation: shimmer 1.6s infinite;
    border-radius: var(--radius-md);
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
</style>
</head>
<body>

<div id="app"></div>

<!-- Speaker notes / no-op markers for the design system -->
<div data-screen-label="Blog Redesign" style="display:none"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design/mock-posts.jsx"></script>
<script type="text/babel" src="design/post-card.jsx"></script>
<script type="text/babel" src="design/composer.jsx"></script>
<script type="text/babel" src="design/tweaks-panel.jsx"></script>

<script type="text/babel">
  const { useEffect, useState } = React;

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "mastheadStyle": "editorial",
    "density": "comfortable",
    "showFeatured": true,
    "authorMode": false,
    "loadingState": false
  }/*EDITMODE-END*/;

  const MOCK_USER = { name: "Lennon Quiñones", role: "Admin" };

  function SiteHeader() {
    return (
      <header className="site-header">
        <div className="site-header__inner">
          <div className="site-header__brand">
            <div className="site-header__logo">
              <img src="design/assets/org-logo.png" alt="CPAAA" />
            </div>
            <div className="site-header__org">Ciudadanos Pro Albergue de Animales de Aguadilla</div>
          </div>
          <nav className="site-header__nav">
            <a href="#">Home</a>
            <a href="#">Adoptar</a>
            <a href="#">About</a>
            <a href="#" className="active">Blog</a>
            <a href="#" className="site-header__donate">Donar</a>
          </nav>
        </div>
      </header>
    );
  }

  function Masthead({ style }) {
    if (style === "minimal") {
      return (
        <section className="masthead">
          <div className="masthead__inner" style={{ padding: "48px 24px 36px" }}>
            <div className="masthead__eyebrow">Diario del albergue</div>
            <h1 className="masthead__title" style={{ fontSize: "clamp(32px, 4vw, 44px)" }}>
              Blog
            </h1>
          </div>
        </section>
      );
    }
    if (style === "stats") {
      return (
        <section className="masthead">
          <div className="masthead__inner">
            <div className="masthead__eyebrow">Diario del albergue</div>
            <h1 className="masthead__title">Historias <em>desde el albergue</em></h1>
            <p className="masthead__lede">
              Adopciones, rescates, jornadas, y la rutina diaria de cuidar a más de 80 animales en Aguadilla, Puerto Rico.
            </p>
            <div className="masthead__meta">
              <span><strong>247</strong> publicaciones</span>
              <span className="masthead__meta-dot"></span>
              <span><strong>1,832</strong> historias compartidas</span>
              <span className="masthead__meta-dot"></span>
              <span><strong>Desde 1990</strong></span>
            </div>
          </div>
        </section>
      );
    }
    // editorial (default)
    return (
      <section className="masthead">
        <div className="masthead__inner">
          <div className="masthead__eyebrow">Diario del albergue</div>
          <h1 className="masthead__title">Historias <em>desde el albergue</em></h1>
          <p className="masthead__lede">
            Adopciones, rescates, jornadas de esterilización, y los pequeños momentos
            que hacen que valga la pena. Publicado en sincronía con nuestra página de Facebook.
          </p>
          <div className="masthead__meta">
            <span><strong>Actualizado</strong> hace 2 días</span>
            <span className="masthead__meta-dot"></span>
            <span>Aguadilla, P.R.</span>
            <span className="masthead__meta-dot"></span>
            <span>Español</span>
          </div>
        </div>
      </section>
    );
  }

  function SiteFooter() {
    return (
      <footer className="site-footer">
        <div className="site-footer__inner">
          <div>
            <div className="site-footer__brand">Ciudadanos Pro Albergue de Animales de Aguadilla</div>
            <p className="site-footer__tagline">Trabajando por el bienestar y la protección animal desde 1990.</p>
          </div>
          <div>
            <div className="site-footer__heading">Enlaces rápidos</div>
            <ul className="site-footer__list">
              <li><a href="#">Sobre nosotros</a></li>
              <li><a href="#">Animales disponibles</a></li>
              <li><a href="#">Proceso de adopción</a></li>
            </ul>
          </div>
          <div>
            <div className="site-footer__heading">Apoyo</div>
            <ul className="site-footer__list">
              <li><a href="#">Donar</a></li>
              <li><a href="#">info@animalrescue.org</a></li>
              <li><a href="#">(787) 505-8255</a></li>
            </ul>
          </div>
        </div>
        <div className="site-footer__bottom">
          © 2026 CPAAA · Aguadilla, Puerto Rico
        </div>
      </footer>
    );
  }

  function LoadingFeed() {
    return (
      <div className="feed__list">
        {[1, 2, 3].map((i) => (
          <div key={i} className="skeleton">
            <div className="skel-line skel-line--short"></div>
            <div className="skel-line skel-line--title"></div>
            <div className="skel-line"></div>
            <div className="skel-line skel-line--short"></div>
            <div className="skel-img"></div>
          </div>
        ))}
      </div>
    );
  }

  function App() {
    const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
    const [posts, setPosts] = useState(MOCK_POSTS);

    function addPost(post) {
      setPosts((p) => [post, ...p.filter((x) => !x.featured)]);
      // Note: we keep featured separate so this re-inserts
    }

    const featured = posts.find((p) => p.featured);
    const others = posts.filter((p) => !p.featured);

    const dense = tweaks.density === "dense";

    return (
      <React.Fragment>
        <SiteHeader />
        <Masthead style={tweaks.mastheadStyle} />

        <main className="feed">
          {tweaks.authorMode && <Composer user={MOCK_USER} onPost={addPost} />}

          {tweaks.loadingState ? (
            <LoadingFeed />
          ) : (
            <React.Fragment>
              {tweaks.showFeatured && featured && <FeaturedPost post={featured} />}
              <div className="feed__list">
                {others.map((post) => (
                  <div
                    key={post.id}
                    className={`feed__item ${post.local ? "feed__item--local" : ""}`}
                  >
                    <PostCard post={post} dense={dense} />
                  </div>
                ))}
              </div>
            </React.Fragment>
          )}
        </main>

        <SiteFooter />

        <TweaksPanel title="Tweaks">
          <TweakSection label="Masthead" />
          <TweakRadio
            label="Style"
            value={tweaks.mastheadStyle}
            onChange={(v) => setTweak("mastheadStyle", v)}
            options={[
              { value: "editorial", label: "Editorial" },
              { value: "stats", label: "Stats" },
              { value: "minimal", label: "Minimal" },
            ]}
          />
          <TweakSection label="Feed" />
          <TweakToggle
            label="Featured story"
            value={tweaks.showFeatured}
            onChange={(v) => setTweak("showFeatured", v)}
          />
          <TweakRadio
            label="Density"
            value={tweaks.density}
            onChange={(v) => setTweak("density", v)}
            options={[
              { value: "comfortable", label: "Comfortable" },
              { value: "dense", label: "Dense" },
            ]}
          />
          <TweakToggle
            label="Loading state"
            value={tweaks.loadingState}
            onChange={(v) => setTweak("loadingState", v)}
          />
          <TweakSection label="Author mode (future)" />
          <TweakToggle
            label="Signed in as admin"
            value={tweaks.authorMode}
            onChange={(v) => setTweak("authorMode", v)}
          />
        </TweaksPanel>
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>

</body>
</html>
