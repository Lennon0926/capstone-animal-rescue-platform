<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">

  <!-- Background -->
  <rect width="720" height="420" fill="#ffffff" rx="8"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Load Test — Request Outcome Distribution</text>
  <text x="360" y="50" text-anchor="middle" font-size="11" fill="#6b7280">50 VU ramp · Artillery v2.0.31 · 2026-05-09 · 3,255 total requests</text>

  <!--
    2026-05-09 load test results:
      Total requests: 3,255
      HTTP 429 (rate limited): 3,156 (96.9%)
      HTTP 2xx (unthrottled):     84 (2.6%)
      Other:                      15 (0.5%)

    Global rate limiter: 100 requests / 15 min per IP
    p95 of unthrottled (2xx) requests: 233ms — all under SLO of 2,000ms

    Stacked bar showing request distribution
    + p95 response time for unthrottled requests
  -->

  <!-- ── Section 1: Request distribution bar ── -->
  <text x="360" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">Request Distribution (single-IP vs global rate limit)</text>

  <!-- total bar width: 560px, x=80..640, y=90..130 -->
  <!-- 429: 96.9% = 542px -->
  <rect x="80" y="90" width="542" height="40" fill="#ef4444" rx="4"/>
  <!-- 2xx: 2.6% = 15px -->
  <rect x="622" y="90" width="15" height="40" fill="#10b981" rx="2"/>
  <!-- other: 0.5% = 3px -->
  <rect x="637" y="90" width="3" height="40" fill="#f59e0b" rx="1"/>

  <text x="351" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">3,156 requests → HTTP 429 Too Many Requests (96.9%)</text>
  <text x="629" y="107" text-anchor="middle" font-size="9" fill="#065f46" transform="rotate(-90,629,107)">2xx</text>

  <!-- Labels below bar -->
  <text x="80"  y="142" font-size="10" fill="#ef4444">HTTP 429 (rate limited): 3,156</text>
  <text x="560" y="142" font-size="10" fill="#10b981">2xx: 84</text>
  <text x="640" y="142" font-size="10" fill="#f59e0b">other: 15</text>

  <!-- Rate limiter explanation box -->
  <rect x="80" y="158" width="560" height="42" fill="#fef2f2" rx="6" stroke="#ef4444" stroke-width="1"/>
  <text x="360" y="173" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">Rate Limiter: 100 requests / 15 min per IP (global)</text>
  <text x="360" y="191" text-anchor="middle" font-size="10" fill="#991b1b">Single-IP load test exhausts limit in the ramp phase. Production traffic from multiple IPs distributes across the limit.</text>

  <!-- ── Section 2: p95 chart for unthrottled requests ── -->
  <text x="360" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">Unthrottled Request Performance (84 successful 2xx requests, ramp phase)</text>

  <!-- Chart area: x=80..640 (width=560), y=240..320 (height=80) -->
  <!-- SLO = 2000ms, show p95=233ms as fraction -->
  <!-- 560 * (233/2000) = 65.2px -->

  <!-- Background / SLO zone -->
  <rect x="80" y="240" width="560" height="80" fill="#f8fafc" rx="4" stroke="#e5e7eb" stroke-width="1"/>

  <!-- p95 bar -->
  <rect x="80" y="255" width="65" height="50" fill="#6366f1" rx="3"/>
  <text x="147" y="285" font-size="12" font-weight="bold" fill="#4f46e5">233 ms</text>
  <text x="147" y="300" font-size="10" fill="#6b7280">p95 latency</text>

  <!-- SLO line at x = 80 + 560 = 640 (at 2000ms) -->
  <!-- show a marker at 2000ms position -->
  <line x1="640" y1="240" x2="640" y2="320" stroke="#10b981" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="638" y="237" text-anchor="end" font-size="10" fill="#10b981">SLO = 2,000 ms</text>

  <!-- Scale labels -->
  <text x="80"  y="334" text-anchor="middle" font-size="10" fill="#6b7280">0</text>
  <text x="220" y="334" text-anchor="middle" font-size="10" fill="#6b7280">500</text>
  <text x="360" y="334" text-anchor="middle" font-size="10" fill="#6b7280">1,000</text>
  <text x="500" y="334" text-anchor="middle" font-size="10" fill="#6b7280">1,500</text>
  <text x="640" y="334" text-anchor="middle" font-size="10" fill="#6b7280">2,000 ms</text>
  <line x1="80" y1="320" x2="640" y2="320" stroke="#9ca3af" stroke-width="1"/>

  <!-- PASS badge -->
  <rect x="400" y="255" width="230" height="50" fill="#d1fae5" rx="6" stroke="#10b981" stroke-width="1"/>
  <text x="515" y="275" text-anchor="middle" font-size="11" fill="#065f46">p95 = 233 ms  (11.7% of SLO)</text>
  <text x="515" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">SMART Obj. 2 PASS ✓</text>

  <!-- ── Summary footer ── -->
  <rect x="80" y="352" width="560" height="44" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1"/>
  <text x="192" y="368" text-anchor="middle" font-size="11" fill="#6b7280">Total Requests</text>
  <text x="192" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">3,255</text>
  <text x="312" y="368" text-anchor="middle" font-size="11" fill="#ef4444">Rate Limited</text>
  <text x="312" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#ef4444">96.9%</text>
  <text x="440" y="368" text-anchor="middle" font-size="11" fill="#10b981">Unthrottled p95</text>
  <text x="440" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#10b981">233 ms</text>
  <rect x="540" y="355" width="96" height="38" fill="#d1fae5" rx="4" stroke="#10b981" stroke-width="1"/>
  <text x="588" y="371" text-anchor="middle" font-size="10" fill="#065f46">SMART Obj. 2</text>
  <text x="588" y="385" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">PASS ✓</text>

  <!-- Source note -->
  <text x="360" y="412" text-anchor="middle" font-size="10" fill="#9ca3af">Source: docs/reports/section-3-2-load-test-results.md · Artillery v2.0.31 · 2026-05-09</text>

</svg>
