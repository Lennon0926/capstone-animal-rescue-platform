<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">

  <!-- Background -->
  <rect width="720" height="380" fill="#ffffff" rx="8"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Performance Optimization — Baseline vs Final (April Sprint)</text>
  <text x="360" y="50" text-anchor="middle" font-size="11" fill="#6b7280">4 optimization rounds applied · 2026-04-05 → 2026-04-11 (historical; May run affected by rate limiter)</text>

  <!--
    Metrics to compare (ms):
      Overall p50:        baseline=109  final=1
      Overall p95:        baseline=166  final=156
      Overall p99:        baseline=400  final=224
      /filters p99:       baseline=2417 final=9
      /health p95:        baseline=308  final=1
      /animals p50:       baseline=107  final=1

    Max value = 2417 → use log scale or cap at 500 with a break indicator for /filters

    Let's do two charts side-by-side or use a split:
    - Left panel: metrics ≤ 500ms (p50, p95, p99 overall; /health p95; /animals p50)
    - Right panel: /filters p99 (2417→9) shown separately with its own scale

    Actually let me do a horizontal grouped bar chart for the 5 metrics (excluding /filters p99 which is an outlier),
    and show /filters p99 as a special callout box.

    Chart area: x=200..680, y=65..300 (width=480, height=235)
    5 metrics, each row height = 235/5 = 47px
    Bar max width = 480px → scale: 480/450 = 1.067px/ms (max=450ms)

    Metrics (capped at 450 for display, /filters shown separately):
      Overall p50:   109 → 1
      Overall p95:   166 → 156
      Overall p99:   400 → 224
      GET /health p95: 308 → 1
      GET /animals p50: 107 → 1

    Colors: baseline=#ef4444, final=#10b981
  -->

  <!-- Legend -->
  <rect x="430" y="58" width="14" height="14" fill="#ef4444" rx="2"/>
  <text x="448" y="70" fill="#374151" font-size="11">Baseline (Apr 5)</text>
  <rect x="560" y="58" width="14" height="14" fill="#10b981" rx="2"/>
  <text x="578" y="70" fill="#374151" font-size="11">Final (Apr 11)</text>

  <!-- Y axis -->
  <line x1="200" y1="65" x2="200" y2="300" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="200" y1="300" x2="680" y2="300" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- X-axis grid lines at 100, 200, 300, 400 ms -->
  <!-- scale: x = 200 + (val/450)*480 -->
  <!-- 100ms → x=307, 200→413, 300→520, 400→627 -->
  <line x1="307" y1="65" x2="307" y2="300" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="307" y="312" text-anchor="middle" font-size="10" fill="#6b7280">100</text>
  <line x1="413" y1="65" x2="413" y2="300" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="413" y="312" text-anchor="middle" font-size="10" fill="#6b7280">200</text>
  <line x1="520" y1="65" x2="520" y2="300" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="520" y="312" text-anchor="middle" font-size="10" fill="#6b7280">300</text>
  <line x1="627" y1="65" x2="627" y2="300" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="627" y="312" text-anchor="middle" font-size="10" fill="#6b7280">400</text>
  <text x="200" y="312" text-anchor="middle" font-size="10" fill="#6b7280">0</text>

  <text x="440" y="325" text-anchor="middle" font-size="10" fill="#6b7280">Response Time (ms)</text>

  <!--
    Row heights: 47px each, starting at y=70
    Row centers: 70+12=82, 129, 176, 223, 270

    Bar height = 14px
    baseline bar: y = center - 15
    final bar:    y = center + 1
  -->

  <!-- ── Row 1: Overall p50 (109 → 1) ── -->
  <text x="195" y="82" text-anchor="end" font-size="10" fill="#374151">Overall p50</text>
  <!-- baseline: 109/450 * 480 = 116.3px -->
  <rect x="201" y="70" width="116" height="14" fill="#ef4444" rx="2"/>
  <text x="321" y="81" font-size="10" fill="#ef4444">109ms</text>
  <!-- final: 1/450 * 480 = 1.1px → show as 3px min -->
  <rect x="201" y="86" width="3" height="14" fill="#10b981" rx="2"/>
  <text x="208" y="97" font-size="10" fill="#10b981">1ms  −99%</text>

  <!-- ── Row 2: Overall p95 (166 → 156) ── -->
  <text x="195" y="129" text-anchor="end" font-size="10" fill="#374151">Overall p95</text>
  <!-- baseline: 166/450*480 = 177px -->
  <rect x="201" y="117" width="177" height="14" fill="#ef4444" rx="2"/>
  <text x="382" y="128" font-size="10" fill="#ef4444">166ms</text>
  <!-- final: 156/450*480 = 166.4px -->
  <rect x="201" y="133" width="167" height="14" fill="#10b981" rx="2"/>
  <text x="372" y="144" font-size="10" fill="#10b981">156ms  −6%</text>

  <!-- ── Row 3: Overall p99 (400 → 224) ── -->
  <text x="195" y="176" text-anchor="end" font-size="10" fill="#374151">Overall p99</text>
  <!-- baseline: 400/450*480 = 426.7 → cap at 478 -->
  <rect x="201" y="164" width="427" height="14" fill="#ef4444" rx="2"/>
  <text x="632" y="175" font-size="10" fill="#ef4444">400ms</text>
  <!-- final: 224/450*480 = 239px -->
  <rect x="201" y="180" width="239" height="14" fill="#10b981" rx="2"/>
  <text x="444" y="191" font-size="10" fill="#10b981">224ms  −44%</text>

  <!-- ── Row 4: GET /health p95 (308 → 1) ── -->
  <text x="195" y="223" text-anchor="end" font-size="10" fill="#374151">/health p95</text>
  <!-- baseline: 308/450*480 = 328.5px -->
  <rect x="201" y="211" width="329" height="14" fill="#ef4444" rx="2"/>
  <text x="534" y="222" font-size="10" fill="#ef4444">308ms</text>
  <!-- final: 1ms → 3px -->
  <rect x="201" y="227" width="3" height="14" fill="#10b981" rx="2"/>
  <text x="208" y="238" font-size="10" fill="#10b981">1ms  −99.7%</text>

  <!-- ── Row 5: GET /api/animals p50 (107 → 1) ── -->
  <text x="195" y="270" text-anchor="end" font-size="10" fill="#374151">/animals p50</text>
  <!-- baseline: 107/450*480 = 114px -->
  <rect x="201" y="258" width="114" height="14" fill="#ef4444" rx="2"/>
  <text x="319" y="269" font-size="10" fill="#ef4444">107ms</text>
  <!-- final: 1ms → 3px -->
  <rect x="201" y="274" width="3" height="14" fill="#10b981" rx="2"/>
  <text x="208" y="285" font-size="10" fill="#10b981">1ms  −99%</text>

  <!-- ── Callout: /filters p99 (2417 → 9) — biggest win ── -->
  <rect x="70" y="330" width="580" height="36" fill="#ecfdf5" rx="6" stroke="#10b981" stroke-width="1"/>
  <text x="360" y="347" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">Biggest win: GET /api/animals/filters p99</text>
  <text x="360" y="362" text-anchor="middle" font-size="11" fill="#065f46">2,417 ms → 9 ms  (−99.6%)  — 4 parallel queries replaced by single RPC + 30 s cache</text>

  <!-- Source note -->
  <text x="360" y="378" text-anchor="middle" font-size="10" fill="#9ca3af">Source: docs/reports/section-3-2-load-test-results.md · April optimization history · 2026-05-09 run data in load-test-p95.svg</text>

</svg>
